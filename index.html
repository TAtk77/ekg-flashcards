<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKG Rhythm Flashcards | Pivotal Health CCT Training</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Lato:wght@400;600;700&display=swap');

  :root{
    --navy:#0b2545;
    --navy-deep:#071a33;
    --steel:#4f7ca8;
    --steel-light:#7fa8cf;
    --accent:#0e7c86;
    --accent-dim:#0a5f67;
    --paper:#fdfaf5;
    --strip-bg:#fdfaf5;
    --card-bg:#ffffff;
    --bg:#eef3f8;
    --panel-bg:#ffffff;
    --border:#d7e1ea;
    --text:#12233c;
    --text-dim:#5b6b7f;
    --grid-major: rgba(14,124,134,0.35);
    --grid-minor: rgba(14,124,134,0.14);
    --shadow: 0 6px 20px rgba(11,37,69,0.12);
  }
  [data-theme="dark"]{
    --paper:#12100c;
    --card-bg:#132238;
    --bg:#081527;
    --panel-bg:#0f1f36;
    --border:#233a56;
    --text:#e8eef6;
    --text-dim:#93a6bf;
    --grid-major: rgba(45,212,191,0.4);
    --grid-minor: rgba(45,212,191,0.16);
    --accent:#2dd4bf;
    --accent-dim:#14b8a6;
    --shadow: 0 6px 24px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Lato',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 60px;
    transition:background .25s, color .25s;
  }
  h1,.brand,.nav-btn,.controls button{
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing:.02em;
  }
  .app{max-width:760px;margin:0 auto;}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--navy),var(--steel));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Barlow Condensed';
    box-shadow:var(--shadow);
    flex-shrink:0;
  }
  header h1{margin:0;font-size:1.5rem;font-weight:700;color:var(--navy);}
  [data-theme="dark"] header h1{color:#fff;}
  header .sub{font-size:.78rem;color:var(--text-dim);font-family:'Lato';letter-spacing:normal;}

  .icon-btn{
    background:var(--panel-bg);border:1px solid var(--border);color:var(--text);
    width:38px;height:38px;border-radius:10px;font-size:1.1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s, background .2s;
  }
  .icon-btn:hover{transform:translateY(-1px);}

  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .pill{
    padding:6px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel-bg);color:var(--text-dim);font-size:.82rem;font-weight:600;
    cursor:pointer;transition:all .15s;font-family:'Lato';
  }
  .pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  [data-theme="dark"] .pill.active{background:var(--accent);border-color:var(--accent);}

  .list-hint{
    text-align:center;font-size:.95rem;font-weight:700;color:var(--navy);
    margin-bottom:16px;font-family:'Barlow Condensed';
  }
  [data-theme="dark"] .list-hint{color:#fff;}

  .card-list{display:flex;flex-direction:column;align-items:center;gap:22px;}

  .flashcard{width:100%;max-width:640px;height:200px;perspective:1600px;cursor:pointer;flex-shrink:0;}
  .card-inner{
    position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.4,1);
    transform-style:preserve-3d;
  }
  .flashcard.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute;inset:0;backface-visibility:hidden;
    border-radius:16px;background:var(--card-bg);box-shadow:var(--shadow);
    border:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .card-back{
    transform:rotateY(180deg);align-items:center;justify-content:center;
    padding:20px 24px;text-align:center;
  }

  .strip-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:var(--strip-bg);}
  .strip-wrap svg{width:100%;height:100%;display:block;}
  .strip-wrap img{width:100%;height:100%;object-fit:contain;background:var(--strip-bg);}
  .card-number{
    text-align:center;font-size:.72rem;color:var(--text-dim);padding:6px;
    border-top:1px solid var(--border);font-family:'Lato';
  }

  .rhythm-name{font-size:1.5rem;font-weight:700;color:var(--navy);line-height:1.2;}
  [data-theme="dark"] .rhythm-name{color:#fff;}
  .rhythm-details{
    font-size:1rem;font-weight:600;color:var(--accent);margin-top:8px;font-family:'Lato';
  }

  .controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .controls button{
    background:var(--panel-bg);border:1px solid var(--border);color:var(--text);
    padding:9px 16px;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;
    transition:transform .15s;
  }
  .controls button:hover{transform:translateY(-1px);}

  .footer-note{text-align:center;color:var(--text-dim);font-size:.76rem;margin-top:22px;}
  .load-msg{text-align:center;color:var(--text-dim);font-size:.85rem;padding:40px 0;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(7,26,51,0.6);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel-bg);border-radius:16px;padding:28px;width:100%;max-width:420px;
    box-shadow:var(--shadow);border:1px solid var(--border);
  }
  .modal h2{margin:0 0 4px;color:var(--navy);font-family:'Barlow Condensed';font-size:1.5rem;}
  [data-theme="dark"] .modal h2{color:#fff;}
  .modal .modal-sub{font-size:.82rem;color:var(--text-dim);margin-bottom:20px;font-family:'Lato';}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:.76rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;font-family:'Lato';}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pill-row .pill.selected{background:var(--navy);border-color:var(--navy);color:#fff;}
  [data-theme="dark"] .pill-row .pill.selected{background:var(--accent);border-color:var(--accent);}
  .modal-actions{display:flex;justify-content:flex-end;margin-top:6px;}
  .btn-primary{background:var(--navy);color:#fff;border:none;padding:10px 22px;border-radius:9px;font-weight:600;cursor:pointer;font-family:'Lato';font-size:.92rem;}
  [data-theme="dark"] .btn-primary{background:var(--accent);}

  @media (max-width:520px){
    .flashcard{height:170px;}
    .rhythm-name{font-size:1.25rem;}
  }
</style>
</head>
<body data-theme="dark">
<div class="app">

  <header>
    <div class="brand">
      <div class="brand-mark">EKG</div>
      <div>
        <h1>Rhythm Flashcards</h1>
        <div class="sub">Beginner Deck &middot; Pivotal Health CCT Training</div>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
  </header>

  <div class="filter-bar" id="filterBar"></div>

  <div id="loadMsg" class="load-msg">Loading deck…</div>

  <div id="deckArea" style="display:none;">
    <div class="controls" style="margin-bottom:14px;">
      <button id="shuffleBtn">🔀 Shuffle</button>
      <button id="newSessionBtn">New Session</button>
    </div>

    <div class="list-hint">Click or tap a card to see the answer</div>

    <div class="card-list" id="cardList"></div>
  </div>

  <div class="footer-note">Strips without a matching image in /images still fall back to a generated placeholder.</div>
</div>

<div class="modal-overlay" id="startModalOverlay">
  <div class="modal">
    <h2>Start a Study Session</h2>
    <div class="modal-sub">Choose how many strips to study and your theme.</div>
    <div class="field">
      <label>Number of Strips</label>
      <div class="pill-row" id="countOptions"></div>
    </div>
    <div class="field">
      <label>Theme</label>
      <div class="pill-row" id="themeOptions">
        <button class="pill" data-theme-choice="dark">Dark</button>
        <button class="pill" data-theme-choice="light">Light</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="startSessionBtn">Start</button>
    </div>
  </div>
</div>

<script>
const THEME_KEY = "cct_theme";
const CSV_PATH = "csv/answers.csv";
const IMAGES_PATH = "images/";

let fullDeck = [];
let deck = [];
let filtered = [];
let categories = ["All"];
let activeCat = "All";

/* ---------- Minimal CSV parser (handles quoted fields) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n' || c === '\r'){
        if(field.length || row.length){ row.push(field); rows.push(row); }
        field = ""; row = [];
        if(c === '\r' && next === '\n') i++;
      } else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim().length));
}

/* ---------- Fallback generated waveform (used when an image is missing) ---------- */
const waveDefaults = {
  "Normal Sinus Rhythm":{type:"normal",bpm:75},
  "Sinus Bradycardia":{type:"normal",bpm:45},
  "Sinus Tachycardia":{type:"normal",bpm:130},
  "Sinus Arrhythmia":{type:"resp",bpm:75},
  "Sinus Pause / Arrest":{type:"pause",bpm:75},
  "Premature Atrial Contraction (PAC)":{type:"pac",bpm:75},
  "Atrial Tachycardia":{type:"normal",bpm:170},
  "Atrial Flutter":{type:"flutter",bpm:75},
  "Atrial Fibrillation":{type:"afib",bpm:90},
  "Wandering Atrial Pacemaker":{type:"wap",bpm:75},
  "Premature Junctional Contraction (PJC)":{type:"pjc",bpm:75},
  "Junctional Rhythm":{type:"junctional",bpm:48},
  "Accelerated Junctional Rhythm":{type:"junctional",bpm:80},
  "Junctional Tachycardia":{type:"junctional",bpm:130},
  "Supraventricular Tachycardia (SVT)":{type:"svt",bpm:190},
  "Premature Ventricular Contraction (PVC)":{type:"pvc",bpm:75},
  "Ventricular Tachycardia (Monomorphic)":{type:"vtach",bpm:170},
  "Ventricular Fibrillation":{type:"vfib",bpm:75},
  "Idioventricular Rhythm":{type:"idio",bpm:30},
  "Torsades de Pointes":{type:"torsades",bpm:190},
  "1st Degree AV Block":{type:"firstdeg",bpm:75},
  "2nd Degree AV Block Type I (Wenckebach)":{type:"wenckebach",bpm:75},
  "2nd Degree AV Block Type II":{type:"mobitz2",bpm:75},
  "3rd Degree (Complete) AV Block":{type:"thirddeg",bpm:75},
  "Asystole":{type:"asystole",bpm:75}
};

function gridBackground(){
  return `
    <defs>
      <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="var(--grid-minor)" stroke-width="0.8"/>
      </pattern>
      <pattern id="bigGrid" width="50" height="50" patternUnits="userSpaceOnUse">
        <rect width="50" height="50" fill="url(#smallGrid)"/>
        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="var(--grid-major)" stroke-width="1.6"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#bigGrid)"/>
  `;
}

function beatPath(x, baseline, opts, s=1, v=1){
  const {pAmp=6, pWidth=10, prLen=16, qrsWide=false, qrsAmp=40, tAmp=10, tWidth=22, showP=true, invertP=false, stLen=8} = opts;
  const pW=pWidth*s, prL=prLen*s, stL=stLen*s, tW=tWidth*s;
  const pA=pAmp*v, qA=qrsAmp*v, tA=tAmp*v;
  let d = ""; let cx = x;
  if(showP){
    const dir = invertP ? -1 : 1;
    d += ` Q ${cx+pW/2} ${baseline-dir*pA} ${cx+pW} ${baseline}`;
    cx += pW;
  }
  cx += prL;
  d += ` L ${cx} ${baseline}`;
  if(!qrsWide){
    d += ` L ${cx+3*s} ${baseline+6*v} L ${cx+7*s} ${baseline-qA} L ${cx+11*s} ${baseline+10*v} L ${cx+15*s} ${baseline}`;
    cx += 15*s;
  } else {
    d += ` L ${cx+4*s} ${baseline-qA*0.6} L ${cx+10*s} ${baseline+qA*0.5} L ${cx+16*s} ${baseline-qA*0.3} L ${cx+24*s} ${baseline}`;
    cx += 24*s;
  }
  cx += stL;
  d += ` L ${cx} ${baseline}`;
  d += ` Q ${cx+tW/2} ${baseline-tA} ${cx+tW} ${baseline}`;
  cx += tW;
  return {d, endX: cx};
}

function buildWave(type, bpm, w=1000, h=260){
  const baseline = h/2;
  const v = h/150;
  const STRIP_SECONDS = 15;
  let pxPerBeat = (w*60)/(STRIP_SECONDS*bpm);
  pxPerBeat = Math.max(22, Math.min(240, pxPerBeat));
  const s = Math.max(0.35, Math.min(1.3, pxPerBeat/70));
  let path = `M 0 ${baseline}`;
  let x = 6;
  const beats = Math.ceil(w / pxPerBeat) + 3;

  const step = (opts, gapAfter=null) => {
    const r = beatPath(x, baseline, opts, s, v);
    path += r.d;
    const consumed = r.endX - x;
    const gap = gapAfter!==null ? gapAfter : Math.max(3, pxPerBeat - consumed);
    x = r.endX + gap;
    path += ` L ${x} ${baseline}`;
  };

  for(let i=0;i<beats && x<w+20;i++){
    switch(type){
      case "normal": step({}); break;
      case "resp": { const wob = Math.sin(i*0.9)*pxPerBeat*0.25; step({}, Math.max(3, pxPerBeat-15*s+wob)); break; }
      case "pause": step({}); if(i===4){ x += pxPerBeat*1.9; path += ` L ${x} ${baseline}`; } break;
      case "pac": if(i%6===4){ step({pAmp:4, invertP:true}, pxPerBeat*0.45); } else step({}); break;
      case "flutter": { for(let f=0; f<3; f++){ path += ` L ${x+6*s} ${baseline-8*v} L ${x+12*s} ${baseline}`; x += 12*s; } step({showP:false}, pxPerBeat*0.3); break; }
      case "afib": { for(let f=0; f<6; f++){ const yy = baseline + (Math.random()-0.5)*6*v; path += ` L ${x+3*s} ${yy}`; x += 3*s; } step({showP:false}, pxPerBeat*(0.55+Math.random()*0.85)); break; }
      case "wap": { const amps=[6,3,8,4]; step({pAmp:amps[i%amps.length], invertP:(i%3===0)}); break; }
      case "pjc": if(i%6===4){ step({showP:true, pAmp:4, invertP:true, prLen:6}, pxPerBeat*0.45); } else step({}); break;
      case "junctional": step({showP:false}); break;
      case "svt": step({showP:false, prLen:6}); break;
      case "pvc": if(i%6===4){ step({showP:false, qrsWide:true, qrsAmp:46}, pxPerBeat*1.3); } else step({}); break;
      case "vtach": step({showP:false, qrsWide:true, qrsAmp:38, prLen:3, stLen:2, tAmp:0, tWidth:0}); break;
      case "vfib": { for(let f=0; f<8; f++){ const yy = baseline + (Math.random()-0.5)*50*v; path += ` L ${x+6*s} ${yy}`; x += 6*s; } break; }
      case "idio": step({showP:false, qrsWide:true, qrsAmp:34, prLen:3}); break;
      case "torsades": { const amp = 30+20*Math.sin(i*0.6); step({showP:false, qrsWide:true, qrsAmp:amp, prLen:2, stLen:2, tAmp:0, tWidth:0}, pxPerBeat*0.5); break; }
      case "firstdeg": step({prLen: (34*s > pxPerBeat*0.6) ? pxPerBeat*0.6/s : 34}); break;
      case "wenckebach": { const cp=i%4; if(cp===3){ path += ` L ${x+14*s} ${baseline-6*v} L ${x+24*s} ${baseline}`; x += 24*s+pxPerBeat*0.5; path += ` L ${x} ${baseline}`; } else { step({prLen: 10+cp*8}); } break; }
      case "mobitz2": { if(i%4===3){ path += ` L ${x+14*s} ${baseline-6*v} L ${x+24*s} ${baseline}`; x += 24*s+pxPerBeat*0.6; path += ` L ${x} ${baseline}`; } else { step({}); } break; }
      case "thirddeg": { path += ` L ${x+6*s} ${baseline-6*v} L ${x+12*s} ${baseline}`; x += 12*s; if(i%2===0){ path += ` L ${x+3*s} ${baseline+5*v} L ${x+7*s} ${baseline-32*v} L ${x+11*s} ${baseline+8*v} L ${x+15*s} ${baseline}`; x += 15*s; } x += pxPerBeat*0.45; path += ` L ${x} ${baseline}`; break; }
      case "asystole": { for(let f=0; f<10; f++){ const yy = baseline + (Math.random()-0.5)*2*v; path += ` L ${x+8*s} ${yy}`; x += 8*s; } break; }
      default: step({});
    }
  }

  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    ${gridBackground()}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- Load deck from CSV ---------- */
async function loadDeck(){
  try{
    const res = await fetch(CSV_PATH, {cache:"no-store"});
    if(!res.ok) throw new Error("CSV not found");
    const text = await res.text();
    const rows = parseCSV(text);
    const header = rows.shift().map(h=>h.trim().toLowerCase());
    const fi = header.indexOf("filename"), ci = header.indexOf("category"), ri = header.indexOf("rhythm"), di = header.indexOf("details");
    fullDeck = rows.map(r => ({
      filename: (r[fi]||"").trim(),
      cat: (r[ci]||"Uncategorized").trim(),
      name: (r[ri]||"").trim(),
      details: di>-1 ? (r[di]||"").trim() : ""
    })).filter(c => c.name);

    if(fullDeck.length === 0) throw new Error("No cards in CSV");

    document.getElementById('loadMsg').style.display = 'none';
    openStartModal();
  } catch(err){
    document.getElementById('loadMsg').innerHTML =
      `Couldn't load csv/answers.csv (${err.message}).<br>If you're opening this file directly from disk, run it through a local server or view it on GitHub Pages — browsers block CSV loading from file:// paths.`;
  }
}

/* ---------- Rendering ---------- */
const cardList = document.getElementById('cardList');
const filterBar = document.getElementById('filterBar');

function renderFilters(){
  filterBar.innerHTML = "";
  categories.forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'pill' + (cat===activeCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { activeCat = cat; applyFilter(); };
    filterBar.appendChild(btn);
  });
}

function applyFilter(){
  filtered = activeCat==="All" ? [...deck] : deck.filter(c=>c.cat===activeCat);
  if(filtered.length===0){ filtered = [...deck]; }
  renderFilters();
  renderList();
}

function renderList(){
  cardList.innerHTML = "";
  filtered.forEach((card, i)=>{
    const imgSrc = IMAGES_PATH + card.filename;
    const fallback = waveDefaults[card.name] || {type:"normal", bpm:75};

    const el = document.createElement('div');
    el.className = 'flashcard';
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front">
          <div class="strip-wrap">
            <img src="${imgSrc}" alt="${card.name} strip" onerror="this.onerror=null;this.parentNode.innerHTML=window.__waveFallback(${JSON.stringify(fallback.type)},${fallback.bpm});">
          </div>
          <div class="card-number">${i+1}</div>
        </div>
        <div class="card-face card-back">
          <div class="rhythm-name">${card.name}</div>
          <div class="rhythm-details">${card.details || ""}</div>
        </div>
      </div>
    `;
    el.onclick = ()=> el.classList.toggle('flipped');
    cardList.appendChild(el);
  });
}
window.__waveFallback = (type,bpm) => buildWave(type,bpm);

/* ---------- Controls ---------- */
document.getElementById('shuffleBtn').onclick = ()=>{
  shuffleArray(filtered);
  renderList();
};

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

/* ---------- Theme toggle ---------- */
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t){
  document.body.setAttribute('data-theme', t);
  themeBtn.textContent = t==='dark' ? '🌙' : '☀️';
  localStorage.setItem(THEME_KEY, t);
  document.querySelectorAll('#themeOptions .pill').forEach(b=>{
    b.classList.toggle('selected', b.dataset.themeChoice===t);
  });
}
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
themeBtn.onclick = ()=>{
  const cur = document.body.getAttribute('data-theme');
  applyTheme(cur==='dark' ? 'light' : 'dark');
};

/* ---------- Start-session modal ---------- */
const startModalOverlay = document.getElementById('startModalOverlay');
const countOptionsBar = document.getElementById('countOptions');
let selectedCount = null;

function buildCountOptions(){
  const total = fullDeck.length;
  const opts = Array.from(new Set([10, 25, total].filter(n => n>0 && n<=total)));
  opts.sort((a,b)=>a-b);
  countOptionsBar.innerHTML = "";
  opts.forEach(n=>{
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.textContent = (n===total) ? `All (${total})` : String(n);
    btn.onclick = ()=>{
      selectedCount = n;
      countOptionsBar.querySelectorAll('.pill').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    countOptionsBar.appendChild(btn);
  });
  // default to "All"
  selectedCount = total;
  const allBtn = [...countOptionsBar.children].find(b=>b.textContent.startsWith('All'));
  if(allBtn) allBtn.classList.add('selected');
}

function openStartModal(){
  buildCountOptions();
  startModalOverlay.classList.add('open');
}

document.querySelectorAll('#themeOptions .pill').forEach(btn=>{
  btn.onclick = ()=> applyTheme(btn.dataset.themeChoice);
});

document.getElementById('startSessionBtn').onclick = ()=>{
  const n = selectedCount || fullDeck.length;
  const pool = shuffleArray([...fullDeck]);
  deck = pool.slice(0, n);
  categories = ["All", ...Array.from(new Set(deck.map(c=>c.cat)))];
  activeCat = "All";
  startModalOverlay.classList.remove('open');
  document.getElementById('deckArea').style.display = 'block';
  applyFilter();
};

document.getElementById('newSessionBtn').onclick = ()=> openStartModal();

/* ---------- Init ---------- */
loadDeck();
</script>
</body>
</html>
